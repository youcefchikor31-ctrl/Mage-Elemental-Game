name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Game & Package APK
        run: |
          # 1. تثبيت أدوات ninja للتصريف السريع
          sudo apt-get update && sudo apt-get install -y ninja-build

          # 2. جلب وتجهيز مكتبة Raylib للأندرويد
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib_src
          cmake -B build_raylib -S raylib_src/src \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DPLATFORM=Android \
            -DANDROID_PLATFORM=26
          cmake --build build_raylib

          # 3. بناء ملف اللعبة C++
          cmake -B build_app -S . \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=26 \
            -Draylib_DIR=$GITHUB_WORKSPACE/build_raylib
          cmake --build build_app

          # 4. التغليف داخل قالب APK
          git clone --depth 1 https://github.com/raylib-extras/raylib-apk-template.git template
          mkdir -p template/app/src/main/jniLibs/arm64-v8a
          cp build_app/MageElements template/app/src/main/jniLibs/arm64-v8a/libmain.so
          cd template
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MageGame-APK
          path: template/app/build/outputs/apk/debug/*.apk
