name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Game and Raylib
        run: |
          # تحديد مسار الـ NDK المثبت تلقائياً على خادم جيت هوب
          NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android NDK from: $NDK_PATH"

          # 1. تحميل وترجمة مكتبة Raylib للأندرويد
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib_src
          mkdir -p build_raylib && cd build_raylib
          cmake ../raylib_src/src \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DPLATFORM=Android \
            -DANDROID_PLATFORM=26
          make -j$(nproc)
          cd ..

          # 2. بناء كود اللعبة C++
          mkdir -p build_app && cd build_app
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=26 \
            -Draylib_DIR=../build_raylib
          make -j$(nproc)
          cd ..

          # 3. تغليف ملف الـ APK
          git clone --depth 1 https://github.com/raylib-extras/raylib-apk-template.git template
          mkdir -p template/app/src/main/jniLibs/arm64-v8a
          cp build_app/MageElements template/app/src/main/jniLibs/arm64-v8a/libmain.so
          cd template
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MageGame-Debug-APK
          path: template/app/build/outputs/apk/debug/*.apk
