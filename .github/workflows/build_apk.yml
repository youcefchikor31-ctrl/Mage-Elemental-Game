name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clone Raylib Source
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib

      - name: Install Ninja Build
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Native Library (libmain.so)
        run: |
          cmake -B build -S . \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=26 \
            -DPLATFORM=Android \
            -DANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          cmake --build build

      - name: Package & Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          PLATFORM_JAR=$(ls -d $ANDROID_SDK_ROOT/platforms/android-*/android.jar | sort -V | tail -n 1)

          mkdir -p apk_stage/lib/arm64-v8a
          cp build/libmain.so apk_stage/lib/arm64-v8a/

          # 1. كتابة مانيفست الأندرويد
          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mageelements.game"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:label="Mage Elements"
                  android:hasCode="true">
                  <activity
                      android:name="com.mageelements.game.MainActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize|screenLayout"
                      android:screenOrientation="sensorLandscape"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="main" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. إنشاء كلاس التشغيل وحزم DEX لضمان التوافق مع كافة أجهزة أندرويد
          mkdir -p src/com/mageelements/game
          cat << 'EOF' > src/com/mageelements/game/MainActivity.java
          package com.mageelements.game;
          public class MainActivity extends android.app.NativeActivity {}
          EOF

          javac -cp $PLATFORM_JAR -d bin src/com/mageelements/game/MainActivity.java
          $BUILD_TOOLS/d8 bin/com/mageelements/game/MainActivity.class --output apk_stage/

          # 3. تجميع ملف APK ومحاذاته
          $BUILD_TOOLS/aapt2 link -I $PLATFORM_JAR \
            --min-sdk-version 26 \
            --target-sdk-version 34 \
            --manifest AndroidManifest.xml \
            -o unsigned.apk

          cd apk_stage
          zip -u -r ../unsigned.apk classes.dex lib/arm64-v8a/libmain.so
          cd ..

          $BUILD_TOOLS/zipalign -v -p 4 unsigned.apk aligned.apk

          # 4. توقيع الـ APK بشهادة Debug جاهزة للتثبيت
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Debug,O=Game,C=US"

          $BUILD_TOOLS/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --out MageElements.apk \
            aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MageElements-APK
          path: MageElements.apk
